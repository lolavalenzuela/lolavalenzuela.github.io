<body data-pagina="proyecto" data-proyecto-id="proyecto-3">

           data/contenido.json (proyectos.proyecto-3.portadas). Acá van repetidas
           solo para que se vean ya en el primer pintado, antes de que corra el
           JS: así la página no parpadea ni salta. El JS las reconoce y no las
           vuelve a armar, sólo les cambia el texto al cambiar de idioma.
           Si cambiás las fotos en el JSON, actualizá también estas dos líneas
           (ruta y medidas) o vas a ver un parpadeo al cargar. -->
      <div class="proyecto__hero proyecto__hero--portadas" data-proyecto-imagen-wrapper
           style="--proporcion-portada: 2000 / 1334; --factor-portada: 1.4993">
        <img class="proyecto__portada"
             src="../assets/img/proyectos/proyecto-3-portada-a.jpg" width="2000" height="1334"
             alt="El mockup de la serie en una cartelera sobre un muro de hormigón: tres afiches de Fuera de Servicio en blanco y negro, con la palabra “Desvío” en rojo sobre el primero, un pasaje urbano en el del medio y la fachada de una torre en el tercero">
        <img class="proyecto__portada"
             src="../assets/img/proyectos/proyecto-3-portada-b.jpg" width="2000" height="1334"
             alt="El mismo mockup con las otras tres piezas de la serie: el afiche rojo que dice “El ojo también necesita perderse”, la tapa de alcantarilla con la flecha y la maraña de cables sobre el empedrado">
