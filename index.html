<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Lola Valenzuela — Diseño integral">
  <meta property="og:description" content="Portfolio de Lola Valenzuela, diseñadora integral especializada en diseño audiovisual, sonoro y gráfico.">
  <meta property="og:image" content="assets/img/about-foto.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lola Valenzuela — Diseño integral">
  <meta name="twitter:description" content="Portfolio de Lola Valenzuela, diseñadora integral especializada en diseño audiovisual, sonoro y gráfico.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Tipografía del logo: se pide antes que el CSS para que "Lola" no
       aparezca un instante en otra letra. Ver base.css. -->
  <link rel="preload" href="assets/fonts/pinyon-script-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/base.css?v=20261005">
  <link rel="stylesheet" href="css/layout.css?v=20261005">
  <link rel="stylesheet" href="css/animaciones.css?v=20261005">

  <!-- Anti-flash del fallback FLIP: si hay una transición pendiente
       guardada por transiciones.js, oculta <main> antes del primer
       pintado para que no haya parpadeo. No hace nada si no hay soporte
       de sessionStorage o no hay nada pendiente. -->
  <script>
    // Este script corre ANTES de que se pinte la página, por eso está acá
    // suelto y no en un archivo aparte.
    // 1) "js-movimiento" hace que el contenido nazca invisible, para que
    //    las animaciones de entrada no se vean empezar a mitad de camino.
    // 2) La red de seguridad: si el JS del sitio no llegara a cargar, a los
    //    3 segundos se saca la clase y el contenido se muestra igual. Nunca
    //    se queda una página en blanco por culpa de una animación.
    // 3) "js-flip-pendiente" es lo de siempre: evita el parpadeo de la
    //    transición entre páginas.
    try {
      document.documentElement.classList.add("js-movimiento");
      // El temporizador queda guardado en window para que js/movimiento.js
      // lo cancele apenas carga. Si el JS no llega a cargar, nadie lo
      // cancela, salta a los 3 segundos y el contenido se muestra igual.
      window.redDeSeguridadMovimiento = setTimeout(function () {
        document.documentElement.classList.remove("js-movimiento");
      }, 3000);
      if (sessionStorage.getItem("flip-pendiente")) {
        document.documentElement.classList.add("js-flip-pendiente");
      }
    } catch (e) {}
  </script>
</head>
<body data-pagina="home" data-titulo-i18n="meta.home.titulo">
  <main class="js-fade-idioma">
    <h1 class="solo-lectores">Lola Valenzuela — Portfolio</h1>

    <!-- PORTADA. Ocupa la primera pantalla; abajo, en la misma página,
         sigue la sección de proyectos. -->
    <section class="portada">
      <span class="portada__anio" data-i18n="home.anio">2026</span>

      <nav class="portada__nav" aria-label="Navegación principal">
        <a class="portada__link" href="#proyectos" data-i18n="nav.proyectos">Proyectos</a>
        <a class="portada__link" href="about.html" data-i18n="nav.sobreMi">Sobre mí</a>
        <button type="button" class="portada__link" data-abrir-contacto data-i18n="nav.contacto">contacto</button>
        <div class="toggle-idioma" role="group" aria-label="Cambiar idioma">
          <button type="button" class="toggle-idioma__opcion" data-idioma-boton="es" aria-current="true">es</button>
          <span class="toggle-idioma__separador" aria-hidden="true">/</span>
          <button type="button" class="toggle-idioma__opcion" data-idioma-boton="en">en</button>
        </div>
      </nav>

      <!-- El nombre ya no es un link: a "Sobre mí" se llega por su botón.
           Lo lee el lector de pantalla desde el <h1> de arriba. -->
      <p class="portada__nombre" aria-hidden="true" data-i18n="marca.logo">Lola</p>

      <a class="portada__baja" href="#proyectos" aria-label="Bajar a proyectos"
         data-i18n-attr="aria-label:nav.bajar">
        <svg viewBox="0 0 12 44" aria-hidden="true" focusable="false">
          <path d="M6 0 V40 M1 35 L6 41 L11 35" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </a>
    </section>

    <!-- PROYECTOS. El contenido lo arma js/main.js desde data/contenido.json:
         un bloque por categoría y adentro sus tarjetas. -->
    <section class="proyectos" id="proyectos" data-grilla-proyectos
             aria-label="Proyectos"></section>
  </main>

  <div class="overlay-contacto" data-overlay-contacto hidden>
    <button type="button" class="overlay-contacto__cerrar" data-cerrar-contacto aria-label="Cerrar" data-i18n-attr="aria-label:nav.cerrar">×</button>
    <div class="overlay-contacto__panel" role="dialog" aria-modal="true" aria-labelledby="contacto-titulo">
      <h2 id="contacto-titulo" class="overlay-contacto__titulo" data-i18n="contacto.titulo">contacto</h2>
      <ul class="overlay-contacto__lista" data-contacto-lista></ul>
    </div>
  </div>

  <script type="module" src="js/main.js?v=20261005"></script>
</body>
</html>
